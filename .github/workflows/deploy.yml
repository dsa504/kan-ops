# Deploy a Kan standalone Release tarball to May First over SSH.
#
# Required repository secrets — see docs/github-secrets.md:
#   HOST, USER, PASSWORD, MAY_FIRST_AUTH_URL, SERVICE_NAME, KAN_APP_ROOT
name: Deploy

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag (e.g. kan-v0.6.0)
        required: true
        type: string
        default: kan-v0.6.0
      dry_run:
        description: "Dry run — upload tarball only; skip migrate/restart/healthcheck"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-mayfirst
  cancel-in-progress: false

env:
  HOST: ${{ secrets.HOST }}
  USER: ${{ secrets.USER }}
  PASSWORD: ${{ secrets.PASSWORD }}
  MAY_FIRST_AUTH_URL: ${{ secrets.MAY_FIRST_AUTH_URL }}
  SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
  KAN_APP_ROOT: ${{ secrets.KAN_APP_ROOT }}
  # Public loopback port (also in apache/kan.dsaneworleans.org.conf)
  KAN_PORT: "3055"
  PUBLIC_URL: https://kan.dsaneworleans.org
  # Prefer env-based sshpass — never embed the password in GITHUB_ENV (breaks on #/$/spaces).
  SSHPASS: ${{ secrets.PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate secrets
        run: |
          set -euo pipefail
          missing=0
          for key in HOST USER PASSWORD MAY_FIRST_AUTH_URL SERVICE_NAME KAN_APP_ROOT; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing repository secret: $key (see docs/github-secrets.md)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          # Normalize: strip trailing slashes / CR from the secret
          ROOT="$(printf '%s' "$KAN_APP_ROOT" | tr -d '\r' | sed 's:/*$::')"
          echo "KAN_APP_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "App root length: ${#ROOT} (value redacted)"

      - name: Checkout kan-ops
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: May First auth grant
        run: |
          set -euo pipefail
          curl --silent --show-error \
            "$MAY_FIRST_AUTH_URL" -X POST \
            -d "user_name=$USER" \
            -d "user_pass=$PASSWORD" \
            -d "action=grant" \
            -o /dev/null -w "auth_grant_http=%{http_code}\n"

      - name: Download Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#kan-}"
          ASSET="kan-standalone-${VERSION}.tar.gz"
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "$ASSET" \
            --dir dist
          test -f "dist/$ASSET"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ls -lh "dist/$ASSET"

      - name: Ensure remote incoming dir
        run: |
          set -euo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no "$USER@$HOST" \
            "set -euo pipefail
             echo \"remote_home=\$HOME remote_pwd=\$(pwd)\"
             test -d \"$KAN_APP_ROOT\" || { echo \"missing KAN_APP_ROOT on server\"; ls -la \"\$HOME/files\" || true; exit 1; }
             mkdir -p \"$KAN_APP_ROOT/incoming\"
             test -w \"$KAN_APP_ROOT/incoming\"
             ls -ld \"$KAN_APP_ROOT\" \"$KAN_APP_ROOT/incoming\""

      - name: Upload tarball and remote-deploy.sh
        run: |
          set -euo pipefail
          # Relative-to-home destination avoids MF scp quirks with absolute paths.
          REMOTE_REL="$(sshpass -e ssh -o StrictHostKeyChecking=no "$USER@$HOST" \
            "realpath --relative-to=\"\$HOME\" \"$KAN_APP_ROOT/incoming\" 2>/dev/null \
             || python3 -c \"import os; print(os.path.relpath(os.path.join('$KAN_APP_ROOT','incoming'), os.path.expanduser('~')))\"")"
          echo "Remote incoming (relative to \$HOME): $REMOTE_REL"
          sshpass -e scp -o StrictHostKeyChecking=no \
            "dist/$ASSET" "$USER@$HOST:$REMOTE_REL/$ASSET"
          sshpass -e scp -o StrictHostKeyChecking=no \
            scripts/remote-deploy.sh "$USER@$HOST:$REMOTE_REL/remote-deploy.sh"
          sshpass -e ssh -o StrictHostKeyChecking=no "$USER@$HOST" \
            "chmod 755 \"$KAN_APP_ROOT/incoming/remote-deploy.sh\" && ls -lh \"$KAN_APP_ROOT/incoming\""

      - name: Remote unpack / migrate / restart
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no "$USER@$HOST" \
            "KAN_APP_ROOT='$KAN_APP_ROOT' SERVICE_NAME='$SERVICE_NAME' \
             '$KAN_APP_ROOT/incoming/remote-deploy.sh' \
             '$KAN_APP_ROOT/incoming/$ASSET'"

      - name: Healthcheck (loopback via SSH)
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          attempt=0
          max_attempts=24
          while [ "$attempt" -lt "$max_attempts" ]; do
            code="$(sshpass -e ssh -o StrictHostKeyChecking=no "$USER@$HOST" \
              "curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:${KAN_PORT}/" || echo 000)"
            echo "loopback HTTP $code (attempt $((attempt + 1))/$max_attempts)"
            if [ "$code" = "200" ] || [ "$code" = "302" ] || [ "$code" = "307" ] || [ "$code" = "308" ]; then
              echo "Loopback health OK"
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 5
          done
          echo "Loopback health failed; recent journal:"
          sshpass -e ssh -o StrictHostKeyChecking=no "$USER@$HOST" \
            "journalctl --user --unit '$SERVICE_NAME' -n 80 --no-pager" || true
          exit 1

      - name: Healthcheck (public URL)
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' "$PUBLIC_URL/" || echo 000)"
          echo "public HTTP $code for $PUBLIC_URL"
          if [ "$code" = "200" ] || [ "$code" = "302" ] || [ "$code" = "307" ] || [ "$code" = "308" ]; then
            echo "Public health OK"
          else
            echo "::warning::Public URL not healthy yet (often means Apache ProxyPass not applied). Loopback check is authoritative."
          fi
