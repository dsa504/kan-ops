# Apache VirtualHost directives — s3.dsaneworleans.org
# May First site 388641 (weborigin015); forever job 388643 → weed mini S3 :8334
# Paste into May First control panel → Web Configuration for this site.
# Docs: ../docs/s3-seaweedfs-checklist.md
#
# MF Web Configuration allowlist: no AllowEncodedSlashes / ProxyTimeout.
# Keep to directives already used on NOLA Kan / CC S3 (ProxyPass + RequestHeader).
#
# Do not paste until the forever job is active and
#   curl -sS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8334/
# returns a non-refused status (e.g. 403).
#
# Port 8334: CC Seaweed already uses 8333 on weborigin015.

ProxyPreserveHost On

# Clients hit HTTPS; SeaweedFS S3 is HTTP on loopback
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port "443"

ProxyPass / http://127.0.0.1:8334/
ProxyPassReverse / http://127.0.0.1:8334/
