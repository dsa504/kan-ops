# Apache VirtualHost directives — kan.dsaneworleans.org
# Paste into the Kan hosting order → Web Configuration (advanced Apache text area).
# Kan has its own hosting order (May First: one web site per order).
# Saving restarts Apache.
#
# BEFORE PASTING: confirm Node is listening on this port (Kan deploy uses 3055).
#   ss -ltnp | grep 127.0.0.1:3055
#   curl -sS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:3055/
#
# Kan is a Next.js app, not a static SPA — do not add RewriteRule → index.html.
#
# Next middleware builds redirects from request.url. Self-hosted Next often uses the
# listen address (localhost:3055) even when X-Forwarded-* is set, producing
# Location: https://localhost:3055/... which does NOT match a single
# ProxyPassReverse for http://127.0.0.1:3055/ — so we reverse all variants and
# Header-edit as a backstop.

RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Host "kan.dsaneworleans.org"
RequestHeader set X-Forwarded-Port "443"
ProxyPreserveHost On

ProxyPass / http://127.0.0.1:3055/
ProxyPassReverse / http://127.0.0.1:3055/
ProxyPassReverse / https://127.0.0.1:3055/
ProxyPassReverse / http://localhost:3055/
ProxyPassReverse / https://localhost:3055/

Header edit Location ^https?://localhost:3055(.*)$ https://kan.dsaneworleans.org$1
Header edit Location ^https?://127\.0\.0\.1:3055(.*)$ https://kan.dsaneworleans.org$1
