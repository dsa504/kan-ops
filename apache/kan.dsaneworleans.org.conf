# Apache VirtualHost directives — kan.dsaneworleans.org
# Paste into May First control panel → hosting order → Web Configuration
# (advanced Apache text area). Saving restarts Apache.
#
# BEFORE PASTING: replace PORT with the chosen loopback port (e.g. 3055).
# Confirm nothing else on the site account listens on that port:
#   ss -ltnp | grep 127.0.0.1:PORT
#   # or: curl -sS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:PORT/
#
# Kan is a Next.js app, not a static SPA — do not add RewriteRule → index.html.

RequestHeader set X-Forwarded-Proto "https" env=HTTPS
ProxyPreserveHost On

ProxyPass / http://127.0.0.1:PORT/
ProxyPassReverse / http://127.0.0.1:PORT/
